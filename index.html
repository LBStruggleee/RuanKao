  <script>
    /* 自愈：任何被缓存旧版页面劫持出的 .html 路由（#/lessons/xxx.html），
       一律立即跳回独立页面——交互课程只能以独立页形式运行 */
    (function () {
      function heal() {
        if (/\.html$/.test(location.hash)) {
          location.replace(location.origin + location.pathname + location.hash.slice(1));
        }
      }
      window.addEventListener("hashchange", heal);
      heal();
    })();
  </script>
  <script>
    /* 站内 .html 页面（交互课程/错题本/目录）直通：在捕获阶段接管点击，
       绕过 Docsify 的哈希路由（否则 .html 会被当 Markdown 渲染成静态文本）。
       兼容三种链接形态：绝对 URL / 相对路径 / Docsify 编译出的 #/... 路由
       （后者来自被缓存的旧版 _sidebar.md，同样接管）。 */
    (function () {
      function targetOf(a) {
        var h = a.getAttribute('href') || '';
        if (/^https?:\/\//.test(h)) { return h; }
        if (h.indexOf('#/') === 0) { return location.origin + location.pathname + h.slice(1); }
        return new URL(h, location.href).href;
      }
      function internalHtml(a) {
        /* 注意：Docsify 会给绝对 http 链接强加 target="_blank"（externalLinkTarget），
           但这些链接是本站的交互课程页——必须在同页接管，不能跳过 */
        if (!a) { return false; }
        var h = a.getAttribute('href') || '';
        if (!/\.html$/.test(h)) { return false; }
        if (/^https?:\/\//.test(h)) { return a.origin === location.origin; }
        return true;
      }
      document.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0 ||
            e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { return; }
        var a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!internalHtml(a)) { return; }
        e.preventDefault();
        e.stopPropagation();
        location.href = targetOf(a);
      }, true);
    })();
  </script>
  <script>
    (function () {
      var badge = document.getElementById('rk-badge');
      function tick() {
        var d = Math.ceil((new Date(2026, 9, 24, 9, 0, 0) - Date.now()) / 86400000);
        badge.textContent = d > 1 ? '📅 距 10/24 考试还有 ' + d + ' 天'
          : d === 1 ? '📅 明天考试，加油！'
          : d === 0 ? '📅 今天考试！'
          : '🏁 考试已结束，感谢使用本站';
      }
      tick();
      setInterval(tick, 3600000);
    })();
  </script>
